name: Integration Tests

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-rpms:
    uses: ./.github/workflows/rpmbuild.yml

  # Build the rhc and rhc-server RPMs from the latest main branch of the
  # RedHatInsights/rhc repository. The rhc rpmbuild workflow does not run on
  # pushes to its main branch, so there are no main-branch artifacts to
  # download. Instead we reproduce its build here (checkout main, build with
  # the same "make rpm" target) and upload the resulting RPMs as artifacts
  # under a dedicated name so they do not clash with this project's own RPMs.
  build-rhc-rpms:
    name: "Build rhc RPMs (${{ matrix.name }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Fedora latest"
            image: "registry.fedoraproject.org/fedora:latest"
            slug: "fedora-latest"
          - name: "Fedora Rawhide"
            image: "registry.fedoraproject.org/fedora:rawhide"
            slug: "fedora-rawhide"

    container:
      image: ${{ matrix.image }}

    steps:
      - name: "Try to update Fedora first"
        if: matrix.slug == 'fedora-rawhide'
        run: |
          dnf -y clean all; dnf -y update || true

      - name: "Install basic packages for 'dnf builddep'"
        run: |
          dnf --setopt install_weak_deps=False install -y \
            git rpm-build go-vendor-tools go-rpm-macros

      - name: "Checkout rhc main branch"
        uses: actions/checkout@v7
        with:
          repository: RedHatInsights/rhc
          ref: main
          persist-credentials: false

      - name: "Add repository directory as a safe directory"
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: "Install build dependencies from rhc.spec"
        run: |
          dnf --setopt install_weak_deps=False builddep -y rhc.spec

      - name: "Build rhc RPMs"
        run: |
          make rpm

      - name: "Collect rhc RPM artifacts"
        run: |
          mkdir -p rhc-rpms
          cp ~/rpmbuild/RPMS/*/*.rpm rhc-rpms/

      - name: "Upload rhc RPM artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: rhc-rpms-${{ matrix.slug }}
          path: rhc-rpms/
          retention-days: 30

  integration-tests:
    name: "Integration Tests (${{ matrix.name }})"
    needs: [build-rpms, build-rhc-rpms]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Fedora latest"
            image: "registry.fedoraproject.org/fedora:latest"
            artifact: "rpms-fedora-latest"
            rhc_artifact: "rhc-rpms-fedora-latest"
          - name: "Fedora Rawhide"
            image: "registry.fedoraproject.org/fedora:rawhide"
            artifact: "rpms-fedora-rawhide"
            rhc_artifact: "rhc-rpms-fedora-rawhide"

    container:
      image: ${{ matrix.image }}

    services:
      postgres:
        image: ghcr.io/candlepin/candlepin-db:latest
      candlepin:
        image: ghcr.io/candlepin/candlepin-app:latest
        options: --hostname candlepin.local
        ports:
          - 8443:8443
      candlepin-repo:
        image: ghcr.io/candlepin/candlepin-repo:latest
        ports:
          - 8080:8080

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Download RPM artifacts"
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ./rpms

      - name: "Download rhc RPM artifacts"
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.rhc_artifact }}
          path: ./rhc-rpms

      - name: "Install test dependencies"
        run: |
          dnf --setopt install_weak_deps=False install -y \
            subscription-manager python3-behave dnf5-plugins openssl curl \
            dbus-daemon

      - name: "Install built RPMs"
        run: |
          dnf install -y ./rpms/*.rpm

      - name: "Install rhc and rhc-server RPMs"
        run: |
          dnf install -y ./rhc-rpms/*.rpm

      - name: "Wait for candlepin to be ready"
        run: |
          for i in $(seq 1 60); do
            if curl -sfk https://candlepin:8443/candlepin/status > /dev/null 2>&1; then
              echo "Candlepin is ready"
              curl -sk https://candlepin:8443/candlepin/status
              exit 0
            fi
            echo "Waiting for candlepin... attempt $i/60"
            sleep 5
          done
          echo "ERROR: Candlepin failed to start within timeout"
          exit 1

      - name: "Configure subscription-manager for candlepin"
        run: |
          subscription-manager config \
            --server.hostname candlepin \
            --server.port 8443 \
            --server.prefix /candlepin \
            --server.insecure 1 \
            --rhsm.baseurl http://candlepin-repo:8080

      - name: "Trust candlepin TLS certificate"
        run: |
          openssl s_client -connect candlepin:8443 -showcerts </dev/null 2>/dev/null \
            | openssl x509 -outform PEM > /etc/rhsm/ca/candlepin-ca.pem
          ln -sf /etc/rhsm/ca/candlepin-ca.pem \
            /etc/pki/ca-trust/source/anchors/candlepin-ca.pem
          update-ca-trust

      - name: "Import candlepin RPM GPG key"
        run: |
          curl -sf http://candlepin-repo:8080/RPM-GPG-KEY-candlepin \
            > /etc/pki/rpm-gpg/RPM-GPG-KEY-candlepin

      - name: "Start D-Bus system bus"
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork
          sleep 1

      - name: "Start RHSM D-Bus service"
        run: |
          /usr/libexec/rhsm-service &
          sleep 2
          busctl --system status com.redhat.RHSM1

      - name: "Start rhc-server Varlink service"
        run: |
          # The container has no systemd, so the rhc-server.socket unit cannot
          # provide socket activation. Started on its own, rhc-server falls back
          # to creating the Unix socket itself at /run/rhc/com.redhat.rhc, which
          # is the Varlink endpoint the rhsm plugin connects to during a refresh.
          mkdir -p /var/log/rhc
          /usr/libexec/rhc/rhc-server > /var/log/rhc/rhc-server.log 2>&1 &
          for i in $(seq 1 30); do
            if [ -S /run/rhc/com.redhat.rhc ]; then
              echo "rhc-server Varlink socket is ready"
              exit 0
            fi
            echo "Waiting for rhc-server Varlink socket... attempt $i/30"
            sleep 1
          done
          echo "ERROR: rhc-server Varlink socket did not appear within timeout"
          cat /var/log/rhc/rhc-server.log || true
          exit 1

      - name: "Verify candlepin connectivity"
        run: |
          subscription-manager version

      - name: "Run integration tests"
        run: |
          mkdir -p results
          behave features/ --no-capture --verbose \
            --junit --junit-directory results/

      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.artifact }}
          path: results/
          retention-days: 30
